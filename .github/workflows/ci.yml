name: CI/CD TPFI IS2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-test-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias en ambiente virtual
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validar reglas de formato con Ruff y Black
        run: |
          source venv/bin/activate
          ruff check src/ tests/
          black --check src/ tests/

      - name: Validar tipado estatico con MyPy y PyRight
        run: |
          source venv/bin/activate
          mypy --ignore-missing-imports src/
          pyright src/

      - name: Evaluacion basica de seguridad con Bandit
        run: |
          source venv/bin/activate
          bandit -r src/

      - name: Ejecutar Tests Unitarios con Pytest (Cobertura >= 85%)
        env:
          AWS_DEFAULT_REGION: us-west-2
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          source venv/bin/activate
          pytest tests/test_cliente-servidor.py tests/test_observer.py --cov=src/tpfi --cov-report=term-missing --cov-fail-under=85

      - name: Generar y actualizar documentacion basica con pdoc
        run: |
          source venv/bin/activate
          pdoc src/tpfi -o docs/