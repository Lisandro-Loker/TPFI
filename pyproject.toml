[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TPFI"
version = "1.0.0"
description = "Trabajo Practico Final Integrador IS2 - Patrones Singleton, Proxy y Observer en AWS"
readme = "README.md"
authors = [
  {name = "Augusto M.Sol", email = "solsito341@hotmail.com"},
  {name = "Lisandro Nahuel Loker Gonzalez", email = "lokerlisandro@gmail.com"}
]
maintainers = [
  {name = "Augusto M.Sol", email = "solsito341@hotmail.com"},
  {name = "Lisandro Nahuel Loker Gonzalez", email = "lokerlisandro@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "boto3",
  "botocore",
]
requires-python = ">= 3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/tpfi"]

[tool.pyright]
include = ["src/tpfi"]
reportMissingImports = false

[tool.coverage.run]
branch = true
source = ["src/tpfi"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache_local"

[tool.hatch.build.targets.wheel]
packages = ["src/tpfi"]